<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="wood1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="wood2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Lower Chopstick (Slightly spread open) -->
    <!-- Tip at (8, 6.5), Handle at (33, 26) -->
    <path d="M 8 6.5 L 31.5 24.5 C 32.5 25.2 33 26.5 32.5 27.5 C 32 28.5 30.8 28.8 29.8 28.2 L 6.8 8 Z" 
          fill="url(#wood2)" stroke="#1c1917" stroke-width="0.7" stroke-linejoin="round" />
    <!-- Lacquer handle -->
    <path d="M 23 18 L 31.5 24.5 C 32.5 25.2 33 26.5 32.5 27.5 C 32 28.5 30.8 28.8 29.8 28.2 L 21.5 21 Z" 
          fill="url(#lacquer)" stroke="#1c1917" stroke-width="0.7" />
    <!-- Gold accent line -->
    <line x1="22" y1="18.5" x2="23.5" y2="20" stroke="#fbbf24" stroke-width="1" />

    <!-- Upper Chopstick (Main pointer, Tip at 2.5, 2.5) -->
    <!-- Tip at (2.5, 2.5), Handle at (26, 32) -->
    <path d="M 2.5 2.5 L 24.5 29.5 C 25.2 30.5 26.5 31 27.5 30.5 C 28.5 29.8 28.8 28.5 28 27.5 L 4.5 2 Z" 
          fill="url(#wood1)" stroke="#1c1917" stroke-width="0.7" stroke-linejoin="round" />
    <!-- Lacquer handle -->
    <path d="M 18.5 22 L 24.5 29.5 C 25.2 30.5 26.5 31 27.5 30.5 C 28.5 29.8 28.8 28.5 28 27.5 L 21.5 19 Z" 
          fill="url(#lacquer)" stroke="#1c1917" stroke-width="0.7" />
    <!-- Gold accent line -->
    <line x1="20" y1="20.5" x2="18.5" y2="22" stroke="#fbbf24" stroke-width="1" />

    <!-- Sharp click pointer dot at tip (2.5, 2.5) -->
    <circle cx="2.5" cy="2.5" r="1.3" fill="#dc2626" stroke="#ffffff" stroke-width="0.8" />
  </g>
</svg>