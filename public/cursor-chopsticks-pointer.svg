<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <linearGradient id="pwood1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="pwood2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="placquer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow2)">
    <!-- Lower Chopstick (Angled to (33, 23), meets upper at tip 3.5, 3.5) -->
    <path d="M 4 4.5 L 31 22 C 32 22.8 32.8 24 32.2 25 C 31.6 26 30.2 26.3 29.2 25.5 L 3 3.5 Z" 
          fill="url(#pwood2)" stroke="#1c1917" stroke-width="0.7" stroke-linejoin="round" />
    <!-- Lacquer handle -->
    <path d="M 22.5 16.5 L 31 22 C 32 22.8 32.8 24 32.2 25 C 31.6 26 30.2 26.3 29.2 25.5 L 21 19 Z" 
          fill="url(#placquer)" stroke="#1c1917" stroke-width="0.7" />
    <line x1="21.5" y1="17.5" x2="23" y2="19" stroke="#fbbf24" stroke-width="1" />

    <!-- Upper Chopstick (Angled to (24, 32), meets lower at tip 2.5, 2.5) -->
    <path d="M 2.5 2.5 L 23.5 29.5 C 24.2 30.5 25.5 31 26.5 30.5 C 27.5 29.8 27.8 28.5 27 27.5 L 4 2 Z" 
          fill="url(#pwood1)" stroke="#1c1917" stroke-width="0.7" stroke-linejoin="round" />
    <!-- Lacquer handle -->
    <path d="M 17.5 21.5 L 23.5 29.5 C 24.2 30.5 25.5 31 26.5 30.5 C 27.5 29.8 27.8 28.5 27 27.5 L 20.5 18.5 Z" 
          fill="url(#placquer)" stroke="#1c1917" stroke-width="0.7" />
    <line x1="19" y1="20" x2="17.5" y2="21.5" stroke="#fbbf24" stroke-width="1" />

    <!-- Pinched Ramen Morsel / Golden Sparkle at Tip (2.5, 2.5) -->
    <circle cx="2.5" cy="2.5" r="2.2" fill="#ef4444" stroke="#ffffff" stroke-width="0.8" />
    <polygon points="2.5,-0.5 3.3,1.5 5.5,2.5 3.3,3.5 2.5,5.5 1.7,3.5 -0.5,2.5 1.7,1.5" fill="#fbbf24" />
  </g>
</svg>